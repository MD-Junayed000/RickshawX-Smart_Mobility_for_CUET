server {
	listen 8080;
	server_name _;

	add_header Access-Control-Allow-Origin "$http_origin" always;
	add_header Vary "Origin" always;
	add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
	add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
	add_header Access-Control-Allow-Credentials "true" always;

	proxy_set_header Authorization $http_authorization;

	if ($request_method = OPTIONS) {
		return 204;
	}

	location = / {
		add_header Content-Type application/json;
		return 200 '{"status":"ok","service":"gateway"}';
	}

	location = /health {
		add_header Content-Type application/json;
		return 200 '{"status":"ok","service":"gateway"}';
	}

	location = /health/auth {
		proxy_pass http://auth:3000/health;
	}

	location = /auth/health {
		proxy_pass http://auth:3000/health;
	}

	location = /health/ride {
		proxy_pass http://ride:3002/health;
	}

	location = /ride/health {
		proxy_pass http://ride:3002/health;
	}

	location = /health/trip {
		proxy_pass http://trip:3004/health;
	}

	location = /trip/health {
		proxy_pass http://trip:3004/health;
	}

	location = /health/payment {
		proxy_pass http://payment:3003/health;
	}

	location = /payment/health {
		proxy_pass http://payment:3003/health;
	}

	location = /health/notification {
		proxy_pass http://notification:3005/health;
	}

	location = /notification/health {
		proxy_pass http://notification:3005/health;
	}

	location /auth/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://auth:3000;
	}

	location = /auth {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://auth:3000/auth;
	}

	location /ride/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://ride:3002;
	}

	location = /ride {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://ride:3002/ride;
	}

	location /trip/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://trip:3004;
	}

	location = /trip {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://trip:3004/trip;
	}

	location /payment/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://payment:3003;
	}

	location = /payment {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://payment:3003/payment;
	}

	location /notification/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://notification:3005;
	}

	location = /notification {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://notification:3005/notification;
	}
}
